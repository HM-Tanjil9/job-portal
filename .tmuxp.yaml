session_name: job-portal-dev
attach: true

start_directory: ~/Developer/job-portal

windows:
  - window_name: frontend
    start_directory: frontend
    panes:
      - shell_command:
          - echo "📁 Frontend Ready"
          - npm run dev

  - window_name: auth
    start_directory: services/auth
    panes:
      - shell_command:
          - echo "🔐 Auth Ready"
          - npm run dev

  - window_name: job
    start_directory: services/job
    panes:
      - shell_command:
          - echo "💼 Job Ready"
          - npm run dev

  - window_name: user
    start_directory: services/user
    panes:
      - shell_command:
          - echo "👤 User Ready"
          - npm run dev

  - window_name: utils
    start_directory: services/utils
    panes:
      - shell_command:
          - echo "🛠 Utils Ready"
          - npm run dev

  - window_name: payment
    start_directory: services/payment
    panes:
      - shell_command:
          - echo "💰 Payment Ready"
          - npm run dev

  - window_name: root
    start_directory: .
    panes:
      - shell_command:
          - echo "📂 Root Ready"
