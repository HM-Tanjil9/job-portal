services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  auth:
    build:
      context: ./services/auth
    container_name: job-auth
    env_file:
      - ./.env
    environment:
      PORT: "5001"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "5001:5001"
    depends_on:
      - kafka

  user:
    build:
      context: ./services/user
    container_name: job-user
    env_file:
      - ./.env
    environment:
      PORT: "5003"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "5003:5003"
    depends_on:
      - auth

  job:
    build:
      context: ./services/job
    container_name: job-job
    env_file:
      - ./.env
    environment:
      PORT: "5002"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "5002:5002"
    depends_on:
      - auth

  utils:
    build:
      context: ./services/utils
    container_name: job-utils
    env_file:
      - ./.env
    environment:
      PORT: "5004"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "5004:5004"
    depends_on:
      - kafka

  payment:
    build:
      context: ./services/payment
    container_name: job-payment
    env_file:
      - ./.env
    environment:
      PORT: "3030"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    ports:
      - "3030:3030"

  frontend:
    build:
      context: ./frontend
    container_name: job-frontend
    ports:
      - "3000:3000"
