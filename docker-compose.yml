services:
  # ==========================================
  # Kafka
  # ==========================================
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==========================================
  # Auth Service
  # ==========================================
  auth:
    build:
      context: ./services/auth
      target: builder
    container_name: job-auth
    command: npm run dev
    env_file:
      - ./.env
    environment:
      PORT: "5001"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./services/auth:/app
      - auth_node_modules:/app/node_modules
    ports:
      - "5001:5001"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(Number(process.env.PORT),'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # User Service
  # ==========================================
  user:
    build:
      context: ./services/user
      target: builder
    container_name: job-user
    command: npm run dev
    env_file:
      - ./.env
    environment:
      PORT: "5003"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./services/user:/app
      - user_node_modules:/app/node_modules
    ports:
      - "5003:5003"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(Number(process.env.PORT),'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # Job Service
  # ==========================================
  job:
    build:
      context: ./services/job
      target: builder
    container_name: job-job
    command: npm run dev
    env_file:
      - ./.env
    environment:
      PORT: "5002"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./services/job:/app
      - job_node_modules:/app/node_modules
    ports:
      - "5002:5002"
    depends_on:
      kafka:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(Number(process.env.PORT),'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # Utils / Mail Service
  # ==========================================
  utils:
    build:
      context: ./services/utils
      target: builder
    container_name: job-utils
    command: npm run dev
    env_file:
      - ./.env
    environment:
      PORT: "5004"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./services/utils:/app
      - utils_node_modules:/app/node_modules
    ports:
      - "5004:5004"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(Number(process.env.PORT),'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # Payment Service
  # ==========================================
  payment:
    build:
      context: ./services/payment
      target: builder
    container_name: job-payment
    command: npm run dev
    env_file:
      - ./.env
    environment:
      PORT: "3030"
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./services/payment:/app
      - payment_node_modules:/app/node_modules
    ports:
      - "3030:3030"
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(Number(process.env.PORT),'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ==========================================
  # Frontend - Next.js Development
  # ==========================================
  frontend:
    build:
      context: ./frontend
      target: deps
    container_name: job-frontend
    command: npm run dev -- --hostname 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "3000:3000"
    depends_on:
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      job:
        condition: service_healthy
      utils:
        condition: service_healthy
      payment:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.connect(3000,'127.0.0.1');s.setTimeout(3000);s.on('connect',()=>{s.end();process.exit(0)});s.on('timeout',()=>{s.destroy();process.exit(1)});s.on('error',()=>process.exit(1));"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  auth_node_modules:
  user_node_modules:
  job_node_modules:
  utils_node_modules:
  payment_node_modules:
  frontend_node_modules:
  frontend_next_cache:
